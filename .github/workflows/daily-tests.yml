name: Daily Playwright Tests

on:
  # The daily run is triggered at 12:00 Europe/Belgrade by an external
  # cron-job.org job calling the workflow_dispatch API: GitHub starts
  # scheduled runs hours late (13:00 UTC cron runs began 15:40-21:45 UTC), so
  # the schedule can't be relied on for timing. It stays as an evening backup
  # for days the external trigger misses; check-already-ran skips it otherwise.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-already-ran:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # Counts main runs since the most recent 11:00 Belgrade time (an hour of
      # slack before the noon trigger), so a backup run delayed past midnight
      # still sees the previous day's noon run. If the API call fails, `skip`
      # is left empty and the tests run anyway.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(TZ=Europe/Belgrade date -d 'today 11:00' +%s)
          [ "$since" -gt "$(date +%s)" ] && since=$(TZ=Europe/Belgrade date -d 'yesterday 11:00' +%s)
          since=$(date -u -d "@$since" +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/daily-tests.yml/runs" \
            -f branch=main -f created=">=$since" -f per_page=100 \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"cancelled\")] | length")
          echo "Runs on main since $since: $count"
          echo "skip=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test-and-report:
    needs: check-already-ran
    # !cancelled() lets this run when check-already-ran was skipped (any
    # non-schedule trigger) or failed.
    if: ${{ !cancelled() && needs.check-already-ran.outputs.skip != 'true' }}
    # Pinned (not ubuntu-latest): the visual-regression baselines are rendered
    # on this image, so an OS bump has to be a deliberate change that also
    # regenerates them. Keep in sync with update-visual-baselines.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit --with-deps

      - name: Create .env.test.local
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$VITE_SUPABASE_URL" \
            "$VITE_SUPABASE_ANON_KEY" \
            "$SUPABASE_SERVICE_ROLE_KEY" > .env.test.local
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # `shell: bash` turns on pipefail, so a failing Playwright run fails this
      # step (and the job) instead of being masked by `tee`'s exit code.
      - name: Run Playwright tests
        shell: bash
        run: npx playwright test 2>&1 | tee test-output.txt
        env:
          FEATURE_SCHOOL_TEACHERS: '1'

      # Runs on failure too -- that is when the email matters most.
      - name: Send email report
        if: ${{ !cancelled() }}
        run: |
          npm install nodemailer
          node scripts/send-test-report.mjs
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      # Publish the same HTML report `npm run test:report` shows locally, so
      # anyone can see the latest results without opening the Actions tab.
      # Runs even when tests fail -- a red report is still the truth.
      - name: Upload Playwright report to Pages artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-report:
    needs: test-and-report
    # Only main may deploy to the github-pages environment. On any other
    # branch this job was rejected by the environment's branch policy and
    # turned a manual run red even though every test had passed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.test-and-report.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
